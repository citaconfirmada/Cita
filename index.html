<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cita Confirmada</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',system-ui,sans-serif;padding:1.5rem;}
.card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:24px;padding:2.8rem 2.2rem;max-width:420px;width:100%;text-align:center;color:#fff;animation:fadeIn .6s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.check-wrap{width:76px;height:76px;background:rgba(29,158,117,.18);border:2px solid #1D9E75;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1.4rem;animation:popIn .5s .2s both;}
@keyframes popIn{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.check-wrap svg{width:36px;height:36px;}
.titulo{font-size:15px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.55);margin-bottom:6px;}
.confirmada{font-size:30px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#5DCAA5;margin-bottom:.2rem;}
.subtitulo{font-size:11px;color:rgba(255,255,255,.3);letter-spacing:3px;text-transform:uppercase;margin-bottom:1.6rem;}
.divider{border:none;border-top:1px solid rgba(255,255,255,.1);margin:1.4rem 0;}
.cliente-box{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:1rem 1.2rem;margin-bottom:.5rem;text-align:left;}
.cliente-nombre{font-size:18px;font-weight:700;color:#fff;margin-bottom:4px;}
.cliente-pasaporte{font-size:12px;color:rgba(255,255,255,.45);letter-spacing:1px;text-transform:uppercase;}
.label-small{font-size:11px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:2px;margin-bottom:8px;}
.fecha-texto{font-size:19px;font-weight:600;color:#9FE1CB;margin-bottom:4px;text-transform:capitalize;}
.hora-texto{font-size:14px;color:rgba(255,255,255,.5);}
.countdown-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:1rem;}
.cd-box{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:12px 4px 10px;}
.cd-num{display:block;font-size:30px;font-weight:700;color:#fff;line-height:1;font-variant-numeric:tabular-nums;}
.cd-unit{display:block;font-size:10px;color:rgba(255,255,255,.35);letter-spacing:1.5px;text-transform:uppercase;margin-top:5px;}
.badge{display:inline-block;background:rgba(29,158,117,.12);color:#5DCAA5;border:1px solid rgba(93,202,165,.25);border-radius:20px;font-size:12px;padding:5px 16px;letter-spacing:1px;margin-top:1.8rem;}
@media(max-width:400px){.card{padding:2rem 1.4rem}.cd-num{font-size:24px}.confirmada{font-size:24px}}
</style>
</head>
<body>
<div class="card">
  <div class="check-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="#1D9E75" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"></polyline>
    </svg>
  </div>

  <p class="titulo">su cita ha sido</p>
  <p class="confirmada">confirmada</p>
  <p class="subtitulo">— appointment confirmed —</p>

  <div class="cliente-box">
    <p class="cliente-nombre" id="cli-nombre">Cargando...</p>
    <p class="cliente-pasaporte" id="cli-pasaporte"></p>
  </div>

  <hr class="divider">

  <p class="label-small">Fecha de su cita</p>
  <p class="fecha-texto" id="fecha-texto">Cargando…</p>
  <p class="hora-texto" id="hora-texto"></p>

  <hr class="divider">

  <p class="label-small" style="margin-bottom:.5rem">Tiempo restante</p>
  <div class="countdown-grid">
    <div class="cd-box"><span class="cd-num" id="cd-d">--</span><span class="cd-unit">días</span></div>
    <div class="cd-box"><span class="cd-num" id="cd-h">--</span><span class="cd-unit">horas</span></div>
    <div class="cd-box"><span class="cd-num" id="cd-m">--</span><span class="cd-unit">min</span></div>
    <div class="cd-box"><span class="cd-num" id="cd-s">--</span><span class="cd-unit">seg</span></div>
  </div>

  <div class="badge">✓ Cita activa</div>
</div>

<script>
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

const p = new URLSearchParams(window.location.search);
const nombre = p.get('nombre') ? decodeURIComponent(p.get('nombre')) : 'Cliente';
const pasaporte = p.get('pasaporte') ? decodeURIComponent(p.get('pasaporte')) : '';
const f = p.get('fecha');
const h = p.get('hora');

document.getElementById('cli-nombre').textContent = nombre;
document.getElementById('cli-pasaporte').textContent = pasaporte ? 'Pasaporte: ' + pasaporte : '';

let CITA;
if(f){
  const[y,mo,d]=f.split('-').map(Number);
  const[hh,mm]=h?h.split(':').map(Number):[10,30];
  CITA=new Date(y,mo-1,d,hh,mm,0,0);
}else{
  const ahora=Date.now();
  CITA=new Date(ahora+15*86400000);
  CITA.setHours(10,30,0,0);
}

const dt=CITA;
document.getElementById('fecha-texto').textContent=DIAS[dt.getDay()]+' '+dt.getDate()+' de '+MESES[dt.getMonth()]+' de '+dt.getFullYear();
document.getElementById('hora-texto').textContent=String(dt.getHours()).padStart(2,'0')+':'+String(dt.getMinutes()).padStart(2,'0')+' hrs';

function tick(){
  const diff=CITA-new Date();
  if(diff<=0){
    ['cd-d','cd-h','cd-m','cd-s'].forEach(id=>document.getElementById(id).textContent='0');
    return;
  }
  document.getElementById('cd-d').textContent=Math.floor(diff/86400000);
  document.getElementById('cd-h').textContent=String(Math.floor((diff%86400000)/3600000)).padStart(2,'0');
  document.getElementById('cd-m').textContent=String(Math.floor((diff%3600000)/60000)).padStart(2,'0');
  document.getElementById('cd-s').textContent=String(Math.floor((diff%60000)/1000)).padStart(2,'0');
}
tick();
setInterval(tick,1000);
</script>
</body>
</html>
